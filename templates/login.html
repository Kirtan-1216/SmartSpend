<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="auth-card">
        <h2>Welcome Back</h2>
        <div class="auth-subtitle">Sign in to continue to SmartSpend</div>
        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input class="auth-box" type="text" name="username" placeholder="Username" required minlength="3" maxlength="40" autocomplete="username">
            <input class="auth-box" type="password" name="password" placeholder="Password" required minlength="6" autocomplete="current-password">
            <button type="submit">Sign In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('signup') }}">Create Account</a>
        </div>
    </div>
</body>
</html>
