<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend | Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        <span>{{ message }}</span>
                        <button class="flash-close" onclick="this.parentElement.remove();">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="auth-wrapper">
        <div class="auth-brand-logo">
            <div class="auth-logo-icon">₹</div>
            <h1>SmartSpend</h1>
        </div>

        <div class="auth-card">
            <h2>Welcome Back</h2>
            <div class="auth-subtitle">Sign in to your Financial Command Center</div>
            <form action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div>
                    <label class="input-label" for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter your username" required minlength="3" maxlength="40" autocomplete="username" autofocus>
                </div>
                <div>
                    <label class="input-label" for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" required minlength="6" autocomplete="current-password">
                </div>
                <button type="submit">Sign In to Dashboard</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="{{ url_for('signup') }}">Create Account</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
