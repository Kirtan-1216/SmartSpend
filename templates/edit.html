<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend | Edit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="dashboard-container">
        <div class="navbar">
            <h2>Edit transaction</h2>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}" class="nav-logout">Logout</a>
            </div>
        </div>

        <div class="card">
            <form action="{{ url_for('edit', id=record['id']) }}" method="POST" class="stack-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <select name="tx_type" required>
                    <option value="expense" {% if record['tx_type'] == 'expense' %}selected{% endif %}>Expense</option>
                    <option value="income" {% if record['tx_type'] == 'income' %}selected{% endif %}>Income</option>
                </select>
                <input type="text" name="category" value="{{ record['CATEGORY'] }}" required>
                <input type="number" step="0.01" min="0.01" name="amount" value="{{ record['AMOUNT'] }}" required>
                <input type="date" name="date" value="{{ record['DATE'] }}" required>
                <input type="text" name="description" value="{{ record['description'] }}" placeholder="Description">
                <button type="submit">Save changes</button>
            </form>
        </div>
    </div>
</body>
</html>
